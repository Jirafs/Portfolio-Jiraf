name: Site checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:cases
      - run: npm run build:learning
      - run: git diff --exit-code -- cases sitemap.xml robots.txt
      - run: git diff --exit-code -- learning/*.html
